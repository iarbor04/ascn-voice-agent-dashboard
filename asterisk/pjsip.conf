[global]
type=global
user_agent=ASCN Voice Agent

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=10.0.0.0/8
local_net=192.168.0.0/16
external_media_address=__EXTERNAL_IP__
external_signaling_address=__EXTERNAL_IP__

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
local_net=172.16.0.0/12
local_net=10.0.0.0/8
local_net=192.168.0.0/16
external_media_address=__EXTERNAL_IP__
external_signaling_address=__EXTERNAL_IP__

#include /ascn-data/asterisk/pjsip-provider.conf
