name: ascn-voice-agent

x-object-storage: &object-storage
  OBJECT_STORAGE_ENDPOINT: http://minio:9000
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-ascn-recordings}
  OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
  OBJECT_STORAGE_ALLOW_INSECURE_HTTP: "true"

x-app-environment: &app-environment
  NODE_ENV: production
  REDIS_URL: redis://app:${REDIS_APP_PASSWORD:?set REDIS_APP_PASSWORD}@redis:6379
  LEGACY_DATA_DIR: /app/legacy-data
  ASTERISK_CONFIG_DIR: /app/asterisk-config
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin@ascn.local}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
  GATEWAY_APP_KEY: ${GATEWAY_APP_KEY:?set GATEWAY_APP_KEY}
  APP_GATEWAY_KEY: ${APP_GATEWAY_KEY:?set APP_GATEWAY_KEY}
  BROWSER_TOKEN_SECRET: ${BROWSER_TOKEN_SECRET:?set BROWSER_TOKEN_SECRET}
  EXTERNAL_CALL_API_KEY: ${EXTERNAL_CALL_API_KEY:?set EXTERNAL_CALL_API_KEY}
  VOICE_GATEWAY_INTERNAL_URL: http://voice-gateway:8787
  TRUST_PROXY: ${TRUST_PROXY:-false}
  ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
  CAMPAIGN_SCHEDULER_ENABLED: ${CAMPAIGN_SCHEDULER_ENABLED:-true}
  CAMPAIGN_SCHEDULER_INTERVAL_MS: ${CAMPAIGN_SCHEDULER_INTERVAL_MS:-15000}
  DIRECT_SIP_RESERVATIONS: "${DIRECT_SIP_RESERVATIONS:-{}}"
  OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_APP_ACCESS_KEY_ID:?set OBJECT_STORAGE_APP_ACCESS_KEY_ID}
  OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_APP_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_APP_SECRET_ACCESS_KEY}
  <<: *object-storage

services:
  config-check:
    build: .
    restart: "no"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      GATEWAY_APP_KEY: ${GATEWAY_APP_KEY:?set GATEWAY_APP_KEY}
      APP_GATEWAY_KEY: ${APP_GATEWAY_KEY:?set APP_GATEWAY_KEY}
      BROWSER_TOKEN_SECRET: ${BROWSER_TOKEN_SECRET:?set BROWSER_TOKEN_SECRET}
      EXTERNAL_CALL_API_KEY: ${EXTERNAL_CALL_API_KEY:?set EXTERNAL_CALL_API_KEY}
      AMI_PASSWORD: ${AMI_PASSWORD:?set AMI_PASSWORD}
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD}
      POSTGRES_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?set POSTGRES_BACKUP_PASSWORD}
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:?set REDIS_ADMIN_PASSWORD}
      REDIS_APP_PASSWORD: ${REDIS_APP_PASSWORD:?set REDIS_APP_PASSWORD}
      REDIS_GATEWAY_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?set REDIS_GATEWAY_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_APP_ACCESS_KEY_ID: ${OBJECT_STORAGE_APP_ACCESS_KEY_ID:?set OBJECT_STORAGE_APP_ACCESS_KEY_ID}
      OBJECT_STORAGE_APP_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_APP_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_APP_SECRET_ACCESS_KEY}
      OBJECT_STORAGE_GATEWAY_ACCESS_KEY_ID: ${OBJECT_STORAGE_GATEWAY_ACCESS_KEY_ID:?set OBJECT_STORAGE_GATEWAY_ACCESS_KEY_ID}
      OBJECT_STORAGE_GATEWAY_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_GATEWAY_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_GATEWAY_SECRET_ACCESS_KEY}
      OBJECT_STORAGE_BACKUP_ACCESS_KEY_ID: ${OBJECT_STORAGE_BACKUP_ACCESS_KEY_ID:?set OBJECT_STORAGE_BACKUP_ACCESS_KEY_ID}
      OBJECT_STORAGE_BACKUP_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_BACKUP_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_BACKUP_SECRET_ACCESS_KEY}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-ascn-recordings}
    command: ["node", "deployment-secret-check.mjs"]
    network_mode: none

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
    depends_on:
      config-check:
        condition: service_completed_successfully
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 128mb
    mem_limit: 768m
    pids_limit: 200
    networks: [data]

  postgres-provision:
    image: postgres:17.11-alpine
    restart: "no"
    depends_on:
      config-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
      ASCN_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD}
      ASCN_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD}
      ASCN_BACKUP_PASSWORD: ${POSTGRES_BACKUP_PASSWORD:?set POSTGRES_BACKUP_PASSWORD}
    volumes:
      - ./ops/postgres/provision.sql:/provision.sql:ro
    command:
      - /bin/sh
      - -ec
      - psql --host=postgres --username=postgres --dbname=postgres --set=migrator_password="$$ASCN_MIGRATOR_PASSWORD" --set=runtime_password="$$ASCN_RUNTIME_PASSWORD" --set=backup_password="$$ASCN_BACKUP_PASSWORD" --file=/provision.sql
    networks: [data]

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    environment:
      REDIS_ADMIN_PASSWORD: ${REDIS_ADMIN_PASSWORD:?set REDIS_ADMIN_PASSWORD}
    depends_on:
      config-check:
        condition: service_completed_successfully
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_ADMIN_PASSWORD:?set REDIS_ADMIN_PASSWORD}
      - --user
      - app
      - "on"
      - ">${REDIS_APP_PASSWORD:?set REDIS_APP_PASSWORD}"
      - ~ascn:rate:*
      - +ping
      - +eval
      - +incr
      - +expire
      - --user
      - gateway
      - "on"
      - ">${REDIS_GATEWAY_PASSWORD:?set REDIS_GATEWAY_PASSWORD}"
      - ~ascn:voice:*
      - +ping
      - +get
      - +getdel
      - +set
      - +del
      - +eval
      - +time
      - +pexpire
      - +zadd
      - +zcard
      - +zrangebyscore
      - +zrem
      - +zremrangebyscore
      - +waitaof
    volumes:
      - redis_data:/data
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_ADMIN_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    depends_on:
      config-check:
        condition: service_completed_successfully
    volumes:
      - object_storage_data:/data
    ports:
      - "127.0.0.1:${ASCN_OBJECT_STORAGE_PORT:-9000}:9000"
    mem_limit: 512m
    pids_limit: 150
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    # A second, non-internal bridge is required for Docker's loopback-only
    # published port. The host backup process reaches only 127.0.0.1:9000;
    # application containers continue to use the isolated data network.
    networks: [data, backup_access]

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      config-check:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-ascn-recordings}
      OBJECT_STORAGE_APP_ACCESS_KEY_ID: ${OBJECT_STORAGE_APP_ACCESS_KEY_ID:?set OBJECT_STORAGE_APP_ACCESS_KEY_ID}
      OBJECT_STORAGE_APP_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_APP_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_APP_SECRET_ACCESS_KEY}
      OBJECT_STORAGE_GATEWAY_ACCESS_KEY_ID: ${OBJECT_STORAGE_GATEWAY_ACCESS_KEY_ID:?set OBJECT_STORAGE_GATEWAY_ACCESS_KEY_ID}
      OBJECT_STORAGE_GATEWAY_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_GATEWAY_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_GATEWAY_SECRET_ACCESS_KEY}
      OBJECT_STORAGE_BACKUP_ACCESS_KEY_ID: ${OBJECT_STORAGE_BACKUP_ACCESS_KEY_ID:?set OBJECT_STORAGE_BACKUP_ACCESS_KEY_ID}
      OBJECT_STORAGE_BACKUP_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_BACKUP_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_BACKUP_SECRET_ACCESS_KEY}
    volumes:
      - ./ops/minio:/policies:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$${OBJECT_STORAGE_BUCKET}" in *[!a-z0-9.-]*|"") echo "invalid bucket" >&2; exit 1;; esac
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}"
        mc version enable "local/$${OBJECT_STORAGE_BUCKET}"
        VERSION_INFO="$$(mc version info "local/$${OBJECT_STORAGE_BUCKET}" --json)"
        VERSION_INFO_COMPACT="$$(printf '%s\n' "$${VERSION_INFO}" | tr -d '[:space:]')"
        case "$${VERSION_INFO_COMPACT}" in
          *'"status":"Enabled"'*) ;;
          *) echo "bucket versioning is not enabled" >&2; exit 1 ;;
        esac
        for POLICY_NAME in app-read gateway-archive backup-read; do
          POLICY_TEMPLATE="$$(cat "/policies/$${POLICY_NAME}.json")"
          case "$${POLICY_TEMPLATE}" in
            *'__BUCKET__'*) ;;
            *) echo "policy template is missing its bucket placeholder: $${POLICY_NAME}" >&2; exit 1 ;;
          esac
          POLICY_RENDERED="$${POLICY_TEMPLATE//__BUCKET__/$${OBJECT_STORAGE_BUCKET}}"
          case "$${POLICY_RENDERED}" in
            *'__BUCKET__'*) echo "policy template rendering failed: $${POLICY_NAME}" >&2; exit 1 ;;
          esac
          printf '%s\n' "$${POLICY_RENDERED}" >"/tmp/$${POLICY_NAME}.json"
        done
        mc admin policy create local ascn-app-read /tmp/app-read.json
        mc admin policy create local ascn-gateway-archive /tmp/gateway-archive.json
        mc admin policy create local ascn-backup-read /tmp/backup-read.json
        mc admin user add local "$${OBJECT_STORAGE_APP_ACCESS_KEY_ID}" "$${OBJECT_STORAGE_APP_SECRET_ACCESS_KEY}"
        mc admin user add local "$${OBJECT_STORAGE_GATEWAY_ACCESS_KEY_ID}" "$${OBJECT_STORAGE_GATEWAY_SECRET_ACCESS_KEY}"
        mc admin user add local "$${OBJECT_STORAGE_BACKUP_ACCESS_KEY_ID}" "$${OBJECT_STORAGE_BACKUP_SECRET_ACCESS_KEY}"
        mc admin policy attach local ascn-app-read --user "$${OBJECT_STORAGE_APP_ACCESS_KEY_ID}"
        mc admin policy attach local ascn-gateway-archive --user "$${OBJECT_STORAGE_GATEWAY_ACCESS_KEY_ID}"
        mc admin policy attach local ascn-backup-read --user "$${OBJECT_STORAGE_BACKUP_ACCESS_KEY_ID}"
    networks: [data]

  app-migrate:
    build: .
    restart: "no"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["/bin/sh", "/app/scripts/run-database-migrations.sh"]
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql://ascn_migrator:${POSTGRES_MIGRATOR_PASSWORD:?set POSTGRES_MIGRATOR_PASSWORD}@postgres:5432/ascn_voice
      CAMPAIGN_SCHEDULER_ENABLED: "false"
    volumes:
      - ascn_data:/app/legacy-data:ro
      - asterisk_config:/app/asterisk-config
    tmpfs:
      - /tmp
      - /app/.next/cache
    networks: [data]
    depends_on:
      postgres-provision:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 768m
    pids_limit: 200

  legacy-recordings-copy:
    build:
      context: .
      dockerfile: Dockerfile.voice
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["node", "scripts/copy-legacy-recordings.mjs"]
    volumes:
      - ascn_data:/legacy-source:ro
      - legacy_recordings:/legacy-recordings
    network_mode: none
    depends_on:
      config-check:
        condition: service_completed_successfully
    mem_limit: 256m
    pids_limit: 100

  app:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql://ascn_app:${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD}@postgres:5432/ascn_voice
      DATABASE_SCHEMA_MANAGED: "true"
    volumes:
      - legacy_recordings:/app/legacy-data/recordings:ro
      - asterisk_config:/app/asterisk-config
    tmpfs:
      - /tmp
      - /app/.next/cache
    networks: [application, data]
    depends_on:
      config-check:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      postgres-provision:
        condition: service_completed_successfully
      app-migrate:
        condition: service_completed_successfully
      recording-migration:
        condition: service_completed_successfully
      legacy-recordings-copy:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 768m
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NUXT_BACKEND_URL: http://app:3000
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "${ASCN_BIND_ADDRESS:-127.0.0.1}:${ASCN_HOST_PORT:-3000}:3000"
    tmpfs: [/tmp]
    networks: [application]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 512m
    pids_limit: 150
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  voice-gateway:
    build:
      context: .
      dockerfile: Dockerfile.voice
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      ASCN_APP_URL: http://app:3000
      GATEWAY_APP_KEY: ${GATEWAY_APP_KEY:?set GATEWAY_APP_KEY}
      APP_GATEWAY_KEY: ${APP_GATEWAY_KEY:?set APP_GATEWAY_KEY}
      BROWSER_TOKEN_SECRET: ${BROWSER_TOKEN_SECRET:?set BROWSER_TOKEN_SECRET}
      AMI_PASSWORD: ${AMI_PASSWORD:?set AMI_PASSWORD}
      ASTERISK_HOST: asterisk
      REDIS_URL: redis://gateway:${REDIS_GATEWAY_PASSWORD:?set REDIS_GATEWAY_PASSWORD}@redis:6379
      RECORDINGS_DIR: /recording-spool
      MAX_BROWSER_SESSIONS: ${MAX_BROWSER_SESSIONS:-5}
      MAX_ACTIVE_CALLS: ${MAX_ACTIVE_CALLS:-50}
      CALL_CAPACITY_LEASE_MS: ${CALL_CAPACITY_LEASE_MS:-120000}
      TERMINAL_OUTBOX_INTERVAL_MS: ${TERMINAL_OUTBOX_INTERVAL_MS:-5000}
      TERMINAL_OUTBOX_CLAIM_MS: ${TERMINAL_OUTBOX_CLAIM_MS:-600000}
      TERMINAL_OUTBOX_CONCURRENCY: ${TERMINAL_OUTBOX_CONCURRENCY:-2}
      TERMINAL_OUTBOX_DEAD_LETTER_TTL_MS: ${TERMINAL_OUTBOX_DEAD_LETTER_TTL_MS:-2592000000}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_GATEWAY_ACCESS_KEY_ID:?set OBJECT_STORAGE_GATEWAY_ACCESS_KEY_ID}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_GATEWAY_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_GATEWAY_SECRET_ACCESS_KEY}
      <<: *object-storage
    ports:
      - "127.0.0.1:${ASCN_VOICE_GATEWAY_PORT:-8787}:8787"
    volumes:
      - recording_spool:/recording-spool
    tmpfs: [/tmp]
    networks: [application, data, voice]
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    pids_limit: 200

  recording-migration:
    build:
      context: .
      dockerfile: Dockerfile.voice
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["node", "scripts/migrate-recordings.mjs"]
    environment:
      DATABASE_URL: postgresql://ascn_app:${POSTGRES_RUNTIME_PASSWORD:?set POSTGRES_RUNTIME_PASSWORD}@postgres:5432/ascn_voice
      LEGACY_RECORDINGS_DIR: /legacy-data/recordings
      MIGRATION_MARKER_PATH: /migration-state/recordings-v1.json
      MIGRATION_CONCURRENCY: ${MIGRATION_CONCURRENCY:-4}
      MIGRATION_MAX_FILES: ${MIGRATION_MAX_FILES:-10000}
      ALLOW_ORPHAN_RECORDINGS: ${ALLOW_ORPHAN_RECORDINGS:-false}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_GATEWAY_ACCESS_KEY_ID:?set OBJECT_STORAGE_GATEWAY_ACCESS_KEY_ID}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_GATEWAY_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_GATEWAY_SECRET_ACCESS_KEY}
      <<: *object-storage
    volumes:
      - ascn_data:/legacy-data:ro
      - migration_state:/migration-state
    networks: [data]
    depends_on:
      postgres-provision:
        condition: service_completed_successfully
      app-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  asterisk:
    build:
      context: .
      dockerfile: Dockerfile.asterisk
    restart: unless-stopped
    environment:
      ASTERISK_EXTERNAL_IP: ${ASTERISK_EXTERNAL_IP:?set ASTERISK_EXTERNAL_IP}
      AMI_PASSWORD: ${AMI_PASSWORD:?set AMI_PASSWORD}
    ports:
      - "${ASCN_SIP_PORT:-5060}:5060/udp"
      - "${ASCN_SIP_PORT:-5060}:5060/tcp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - asterisk_config:/ascn-data/asterisk:ro
    networks: [voice]
    depends_on:
      voice-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    pids_limit: 250

volumes:
  ascn_data:
  postgres_data:
  redis_data:
  object_storage_data:
  recording_spool:
  asterisk_config:
  legacy_recordings:
  migration_state:

networks:
  application:
  backup_access:
  data:
    internal: true
  voice:
